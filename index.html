<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EquiBurst</title>

  <!-- Google Fonts: clean modern pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@1,400;1,700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="An interactive art piece celebrating thinkers who changed the world.">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#000000">
</head>

<body>

  <!-- Intro splash — fades away after 2.5s -->
  <div id="intro">
    <span id="intro-title">EquiBurst</span>
    <span id="intro-sub">Every action leaves a mark.</span>
  </div>

  <!-- Full-screen particle canvas -->
  <canvas id="burst-canvas"></canvas>

  <!-- Ripple ring canvas (separate layer) -->
  <canvas id="ripple-canvas"></canvas>

  <!-- Idle aurora ambient glow -->
  <div id="aurora"></div>

  <!-- Full-screen colour flash (triggered on click) -->
  <div id="screen-flash"></div>

  <!-- Persistent film-grain texture -->
  <div id="grain"></div>

  <!-- Quote overlay (shown on click) -->
  <div id="quote-overlay" aria-live="polite">
    <div id="quote-card">
      <blockquote id="quote-text"></blockquote>
      <div id="quote-rule"></div>
      <cite id="quote-author"></cite>
    </div>
  </div>

  <!-- Corner hint -->
  <p id="tagline">Click anywhere · Space to burst</p>

  <!-- Impact counter -->
  <div id="counter">
    <span id="counter-num">0</span>
    <span id="counter-label">impacts</span>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
